    <style>
      /* Splash previo a React: cubre el hueco entre el HTML inicial y el primer
         render (bundle + fuentes). Vive fuera de React a propósito — así se ve
         de inmediato, sin esperar a que cargue ni un KB de JS de la app. */
      #g3i-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020608;
        transition: opacity 420ms ease 120ms, visibility 420ms ease 120ms;
      }
      #g3i-splash svg { width: 72px; height: auto; }
      #g3i-splash[data-hide] { opacity: 0; visibility: hidden; pointer-events: none; }
      body.g3i-ready #g3i-splash { display: none; }

      @keyframes g3i-splash-bar {
        from { opacity: 0; transform: translate(-14px, 14px); }
        to   { opacity: 1; transform: translate(0, 0); }
      }
      @keyframes g3i-splash-pop {
        0%   { opacity: 0; transform: scale(0.35); }
        70%  { opacity: 1; transform: scale(1.12); }
        100% { opacity: 1; transform: scale(1); }
      }
      #g3i-splash [data-piece] { transform-box: fill-box; transform-origin: center; opacity: 0; }
      #g3i-splash [data-piece='bar'] { animation: g3i-splash-bar 520ms cubic-bezier(0.22,1,0.36,1) forwards; }
      #g3i-splash [data-piece='dot'] { animation: g3i-splash-pop 380ms cubic-bezier(0.34,1.56,0.64,1) forwards; }
      #g3i-splash [data-bar='3'] { animation-delay: 0ms; }
      #g3i-splash [data-bar='2'] { animation-delay: 130ms; }
      #g3i-splash [data-bar='1'] { animation-delay: 260ms; }
      #g3i-splash [data-dot='blue'] { animation-delay: 430ms; }
      #g3i-splash [data-dot='red']  { animation-delay: 530ms; }
      #g3i-splash [data-dot='gold'] { animation-delay: 630ms; }

      @media (prefers-reduced-motion: reduce) {
        #g3i-splash [data-piece] { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-RFAqrTyU.js"></script>
